<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef0fb;line-height:1.7;overflow-x:hidden;background:#04050c}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .portal{position:fixed;top:0;right:0;z-index:0;width:420px;height:420px;perspective:800px;pointer-events:none;opacity:.85;animation:portalIn 2.4s cubic-bezier(.2,.8,.2,1) .3s both}
  .portal .ringA,.portal .ringB{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(139,92,246,.5);box-shadow:0 0 34px rgba(139,92,246,.4),inset 0 0 34px rgba(139,92,246,.35)}
  .portal .ringA{transform:rotateX(68deg) rotateZ(0deg);animation:ringA 9s linear infinite}
  .portal .ringB{transform:rotateY(68deg) rotateZ(90deg);border-color:rgba(34,211,238,.45);box-shadow:0 0 30px rgba(34,211,238,.4),inset 0 0 30px rgba(34,211,238,.35);animation:ringB 7s linear infinite}
  .portal .core{position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,#eab308,#f472b6 40%,transparent 72%);filter:blur(2px);animation:corePulse 3s ease-in-out infinite}
  @keyframes ringA{to{transform:rotateX(68deg) rotateZ(360deg)}}
  @keyframes ringB{to{transform:rotateY(68deg) rotateZ(450deg)}}
  @keyframes corePulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
  @keyframes portalIn{from{opacity:0;transform:translate(40px,-40px) scale(.6)}to{opacity:.85;transform:none}}
  .ribbon{position:fixed;inset:-10%;z-index:0;pointer-events:none;overflow:hidden}
  .ribbon i{position:absolute;width:120%;height:60px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.22),rgba(34,211,238,.22),transparent);filter:blur(6px);animation:ribbon 11s ease-in-out infinite}
  .ribbon i:nth-child(1){top:24%;animation-duration:13s}
  .ribbon i:nth-child(2){top:60%;animation-delay:-5s;animation-duration:9s}
  .ribbon i:nth-child(3){top:44%;animation-delay:-8s;animation-duration:15s;background:linear-gradient(90deg,transparent,rgba(244,114,182,.2),rgba(234,179,8,.2),transparent)}
  @keyframes ribbon{0%,100%{transform:translateX(40%) skewX(-18deg);opacity:.2}50%{transform:translateX(-40%) skewX(-18deg);opacity:1}}
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.014) 4px 5px)}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 10%,transparent 40%,rgba(3,4,10,.85) 100%)}
  .shell{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:26px 16px 18px}
  .brand{text-align:center;margin-bottom:18px}
  .logo3d{position:relative;width:66px;height:66px;margin:0 auto 14px;perspective:700px;animation:floaty 5s ease-in-out infinite}
  .cube{position:absolute;inset:0;transform-style:preserve-3d;animation:cubeRot 6s linear infinite}
  .cube i{position:absolute;inset:0;border-radius:18px;background:linear-gradient(135deg,rgba(139,92,246,.85),rgba(34,211,238,.85));display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal;box-shadow:0 0 26px rgba(139,92,246,.5)}
  .cube i:nth-child(1){transform:rotateY(0) translateZ(33px)}
  .cube i:nth-child(2){transform:rotateY(90deg) translateZ(33px)}
  .cube i:nth-child(3){transform:rotateY(180deg) translateZ(33px)}
  .cube i:nth-child(4){transform:rotateY(-90deg) translateZ(33px)}
  .cube i:nth-child(5){transform:rotateX(90deg) translateZ(33px)}
  .cube i:nth-child(6){transform:rotateX(-90deg) translateZ(33px)}
  @keyframes cubeRot{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:26px;font-weight:900;letter-spacing:-.5px;text-align:center;direction:rtl}
  .glitch{position:relative;display:inline-block}
  .glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;background:linear-gradient(90deg,#c7d2fe,#67e8f9,#a5b4fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;overflow:hidden}
  .glitch::before{color:#f472b6;-webkit-text-fill-color:#f472b6;clip-path:inset(0 0 62% 0);animation:gl1 3.2s steps(2) infinite;opacity:.85}
  .glitch::after{color:#22d3ee;-webkit-text-fill-color:#22d3ee;clip-path:inset(62% 0 0 0);animation:gl2 2.8s steps(2) infinite;opacity:.85}
  @keyframes gl1{0%,8%,100%{transform:translate(0)}10%,14%{transform:translate(-2px,-1px)}16%,20%{transform:translate(2px,1px)}}
  @keyframes gl2{0%,8%,100%{transform:translate(0)}12%,16%{transform:translate(2px,1px)}18%,22%{transform:translate(-2px,-1px)}}
  .sub{color:#8b93ad;font-size:12.5px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;animation:fadeUp .9s .6s both}
  .sub::before,.sub::after{content:"";width:30px;height:1px;background:linear-gradient(90deg,transparent,#8b93ad);opacity:.5}
  .sub::after{transform:scaleX(-1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card{position:relative;background:rgba(14,16,34,.6);border-radius:22px;padding:20px;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.1);overflow:hidden;animation:fadeUp .9s .4s both}
  .card::before{content:"";position:absolute;inset:0;background:
    radial-gradient(520px circle at var(--mx) var(--my),rgba(139,92,246,.2),transparent 45%);opacity:0;transition:opacity .35s;pointer-events:none}
  .card:hover::before{opacity:1}
  .borderRun{position:absolute;inset:-1px;border-radius:22px;padding:1.5px;pointer-events:none;
    background:conic-gradient(from var(--ang),transparent 0 20%,#8b5cf6 35%,#22d3ee 50%,#f472b6 65%,transparent 80%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 4s linear infinite}
  @property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
  @keyframes ang{to{--ang:360deg}}
  .chipRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .chip{position:relative;text-align:center;padding:10px 4px;border-radius:12px;background:rgba(10,12,26,.5);border:1px solid rgba(255,255,255,.09);font-size:11px;font-weight:700;color:#9aa1bd;overflow:hidden;transition:.3s}
  .chip::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-130%);transition:transform .7s}
  .chip:hover{color:#fff;border-color:#8b5cf6;box-shadow:0 0 18px rgba(139,92,246,.4);transform:translateY(-2px)}
  .chip:hover::after{transform:translateX(130%)}
  .chip b{display:block;font-size:17px;margin-bottom:2px;background:linear-gradient(90deg,#a78bfa,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .inp{position:relative;margin-bottom:12px}
  .inp .ic{position:absolute;right:13px;top:13px;font-size:13px;color:#6d7590;transition:.25s;pointer-events:none;font-style:normal}
  .inp input,.inp textarea{width:100%;padding:14px 36px 4px 12px;border-radius:13px;border:1px solid rgba(255,255,255,.11);background:rgba(10,12,26,.55);font:inherit;font-size:14px;color:#eef0fb;outline:none;transition:.28s;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
  .inp textarea{min-height:96px;resize:vertical;padding-top:22px}
  .inp label{position:absolute;top:13px;right:36px;font-size:12.5px;color:#6d7590;pointer-events:none;transition:.22s cubic-bezier(.2,.8,.2,1);font-weight:600}
  .inp:focus-within .ic{color:#22d3ee;transform:scale(1.2) rotate(8deg)}
  .inp input:focus,.inp textarea:focus{border-color:#22d3ee;background:rgba(12,14,30,.9);box-shadow:0 0 0 4px rgba(34,211,238,.15),0 0 26px -6px rgba(34,211,238,.6)}
  .inp.filled label,.inp:focus-within label{top:3px;font-size:10px;color:#67e8f9}
  .inp.filled .ic{color:#67e8f9}
  .track{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
  .track i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#8b5cf6,#22d3ee,#eab308);transition:width .2s;box-shadow:0 0 12px rgba(34,211,238,.8)}
  .counter{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:#6d7590}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:14px;padding:13px;font:inherit;font-weight:800;font-size:14.5px;color:#fff;cursor:pointer;margin-top:6px;overflow:hidden;transition:transform .2s,box-shadow .3s;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);background-size:200% 200%;box-shadow:0 16px 40px -14px rgba(6,182,212,.65)}
  .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%);transform:translateX(-130%);transition:transform .6s}
  .btn:hover{background-position:100% 50%;transform:translateY(-2px);box-shadow:0 20px 48px -14px rgba(124,58,237,.75)}
  .btn:hover::before{transform:translateX(130%)}
  .btn:active{transform:scale(.97)}
  .btn .spin{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite}
  .btn.loading .spin{display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .charge{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
  .btn.charging .charge{opacity:1}
  .charge i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff,#eab308);filter:blur(1px);animation:chargeOrbit 1.1s ease-in-out infinite alternate}
  @keyframes chargeOrbit{from{transform:translateX(-26px) scale(.7);opacity:.6}to{transform:translateX(26px) scale(1.3);opacity:1}}
  .burst{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:fly 1s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--bx),var(--by)) scale(0);opacity:0}}
  .note{display:none;text-align:center;margin-top:12px;font-weight:700;font-size:13px;border-radius:12px;padding:10px}
  .note.ok{color:#4ade80;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25)}
  .note.err{color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25)}
  .check{display:none;margin:8px auto 0;width:50px;height:50px}
  .check circle{stroke:#4ade80;stroke-width:3;fill:none;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .6s ease forwards}
  .check path{stroke:#4ade80;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s ease .55s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .confetti{position:fixed;z-index:6;width:8px;height:13px;top:-20px;pointer-events:none;opacity:.95;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
  .signature{text-align:center;margin-top:20px;position:relative;z-index:2;animation:fadeUp 1s .8s both}
  .abdullah-signature{font-family:'Alex Brush',cursive;font-size:42px;line-height:1.1;display:inline-block;position:relative;
    background:linear-gradient(180deg,#67e8f9 0%,#818cf8 55%,#c084fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(129,140,248,.45));animation:sign 2s cubic-bezier(.2,.8,.2,1) 1.4s both}
  @keyframes sign{from{opacity:0;letter-spacing:14px;filter:blur(10px)}to{opacity:1;letter-spacing:2px;filter:blur(0)}}
  .sig-line{position:relative;width:150px;height:2px;margin:10px auto 0}
  .sig-line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .sig-line path{fill:none;stroke:url(#sigGrad);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:drawS 1.1s ease-out 2.6s forwards}
  .sig-line .dot{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#c084fc;box-shadow:0 0 12px 3px rgba(192,132,252,.8);opacity:0;animation:dotPop .5s ease-out 3.6s forwards}
  .sig-line .dot:first-child{left:0}.sig-line .dot:last-child{right:0}
  @keyframes drawS{to{stroke-dashoffset:0}}
  @keyframes dotPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  .sig-spark i{position:absolute;font-style:normal;font-size:13px;color:#c4b5fd;opacity:0;animation:spark 2.4s ease-in-out infinite}
  .sig-spark i:nth-child(1){left:-34px;top:4px;animation-delay:2.8s}
  .sig-spark i:nth-child(2){right:-30px;top:-6px;animation-delay:3.4s}
  .sig-spark i:nth-child(3){left:-14px;bottom:-14px;animation-delay:3s;font-size:9px}
  .sig-spark i:nth-child(4){right:-8px;bottom:-18px;animation-delay:3.8s;font-size:9px}
  @keyframes spark{0%,60%,100%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1)}45%{opacity:.9;transform:translateY(-4px) scale(.9)}}
  footer{position:relative;z-index:2;text-align:center;color:#5c6478;font-size:11.5px;margin:16px 0 4px}
  @media(max-width:520px){.card{padding:16px 14px}.portal{width:300px;height:300px;top:-60px;right:-80px}h1{font-size:22px}.chip b{font-size:14px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="portal"><div class="ringA"></div><div class="ringB"></div><div class="core"></div></div>
<div class="ribbon"><i></i><i></i><i></i></div>
<div class="scan"></div>
<div class="vignette"></div>

<div class="shell">
  <div class="brand">
    <div class="logo3d"><div class="cube"><i>✦</i><i>✦</i><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div></div>
    <h1 class="glitch" data-text="تواصل معنا">تواصل معنا</h1>
    <div class="sub">أرسل رسالتك وسنرد عليك بأقرب وقت</div>
  </div>

  <div class="card" id="card">
    <div class="borderRun"></div>
    <div class="chipRow">
      <div class="chip"><b>٢٤/٧</b>رد سريع</div>
      <div class="chip"><b>⚡</b>استجابة فورية</div>
      <div class="chip"><b>🔒</b>خصوصية تامة</div>
      <div class="chip"><b>★</b>جودة عالية</div>
    </div>
    <div class="inp"><span class="ic">◈</span><input id="name" maxlength="80" autocomplete="name"><label>الاسم</label></div>
    <div class="inp"><span class="ic">◉</span><input id="phone" type="tel" maxlength="20" inputmode="tel" autocomplete="tel"><label>رقم الجوال</label></div>
    <div class="inp"><span class="ic">✉</span><input id="email" type="email" maxlength="120" inputmode="email" autocomplete="email"><label>الإيميل</label></div>
    <div class="inp"><span class="ic">❋</span><textarea id="message" maxlength="2000"></textarea><label>رسالتك *</label>
      <div class="track"><i id="pbar"></i></div>
      <div class="counter"><span id="cnt">0 / 2000</span><span>مطلوب</span></div>
    </div>
    <button class="btn" id="send"><span class="lbl">إرسال الرسالة</span><span class="spin"></span><span class="charge"><i></i></span></button>
    <svg class="check" id="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-16"/></svg>
    <div class="note ok" id="okMsg">تم استلام رسالتك بنجاح</div>
    <div class="note err" id="errMsg"></div>
  </div>

  <div class="signature">
    <span class="abdullah-signature"><span class="sig-spark"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></span>Abdullah</span>
    <div class="sig-line">
      <svg viewBox="0 0 200 10"><defs><linearGradient id="sigGrad" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><path d="M2 6 Q 50 2 100 6 T 198 5"/></svg>
      <i class="dot"></i><i class="dot"></i>
    </div>
  </div>

  <footer>جميع الحقوق محفوظة © 2026</footer>
</div>

<script>
(function(){
  var cv = document.getElementById("stars"), ctx = cv.getContext("2d"), W, H, pts = [], mx = -999, my = -999;
  function rs(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", rs); rs();
  var n = Math.max(40, Math.floor(W * H / 22000));
  for (var i = 0; i < n; i++){ pts.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.5+.4, vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4}); }
  addEventListener("mousemove", function(e){ mx = e.clientX; my = e.clientY; });
  addEventListener("mouseleave", function(){ mx = -999; my = -999; });
  (function draw(){
    ctx.clearRect(0,0,W,H);
    for (var i = 0; i < pts.length; i++){
      var p = pts[i]; p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = "rgba(167,139,250,.8)"; ctx.fill();
      for (var j = i + 1; j < pts.length; j++){
        var q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx*dx + dy*dy;
        if (d2 < 9500){ ctx.strokeStyle = "rgba(139,92,246," + (0.15*(1-d2/9500)) + ")"; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
      }
      if (mx > 0){ var dm = (p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my); if (dm < 81000){ ctx.strokeStyle = "rgba(34,211,238," + (0.3*(1-dm/81000)) + ")"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mx,my); ctx.stroke(); } }
    }
    requestAnimationFrame(draw);
  })();

  var card = document.getElementById("card");
  card.addEventListener("mousemove", function(e){
    var r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
    var dx = ((e.clientX - r.left) / r.width - .5) * 2.4, dy = ((e.clientY - r.top) / r.height - .5) * 2.4;
    card.style.transform = "perspective(900px) rotateY(" + dx + "deg) rotateX(" + (-dy) + "deg)";
  });
  card.addEventListener("mouseleave", function(){ card.style.transform = ""; });

  var btn = document.getElementById("send");
  btn.addEventListener("click", function(e){
    var r = btn.getBoundingClientRect();
    var cols = ["#8b5cf6","#22d3ee","#f472b6","#eab308","#fff"];
    for (var k = 0; k < 14; k++){
      var b = document.createElement("i"); b.className = "burst";
      var a = Math.random() * Math.PI * 2, d = 24 + Math.random() * 66;
      b.style.cssText = "left:" + (e.clientX - r.left) + "px;top:" + (e.clientY - r.top) + "px;background:" + cols[k % cols.length] + ";--bx:" + Math.cos(a)*d + "px;--by:" + Math.sin(a)*d + "px;box-shadow:0 0 10px " + cols[k % cols.length];
      btn.appendChild(b); setTimeout(function(el){ el.remove(); }, 1000, b);
    }
  });

  function confetti(){
    var cols = ["#8b5cf6","#22d3ee","#f472b6","#eab308","#4ade80"];
    for (var k = 0; k < 60; k++){
      var c = document.createElement("i"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = cols[k % cols.length];
      c.style.animationDuration = (2.4 + Math.random() * 2.4) + "s";
      c.style.animationDelay = Math.random() * .8 + "s";
      document.body.appendChild(c);
      setTimeout(function(el){ el.remove(); }, 6000, c);
    }
  }

  function sync(id){ document.getElementById(id).classList.toggle("filled", document.getElementById(id).value.trim().length > 0); }
  ["name","phone","email"].forEach(function(id){ document.getElementById(id).addEventListener("input", function(){ sync(id); }); });
  var msg = document.getElementById("message");
  msg.addEventListener("input", function(){
    sync("message");
    document.getElementById("cnt").textContent = msg.value.length + " / 2000";
    var pc = Math.min(100, msg.value.length / 2000 * 100);
    document.getElementById("pbar").style.width = pc + "%";
  });

  btn.onclick = function(){
    var ok = document.getElementById("okMsg"), err = document.getElementById("errMsg"), check = document.getElementById("check");
    var body = { name: document.getElementById("name").value.trim(), phone: document.getElementById("phone").value.trim(), email: document.getElementById("email").value.trim(), message: msg.value.trim() };
    ok.style.display = "none"; err.style.display = "none"; check.style.display = "none";
    if (body.message.length < 3){ err.textContent = "اكتب رسالتك أولًا."; err.style.display = "block"; return; }
    btn.classList.add("loading","charging"); btn.disabled = true;
    setTimeout(function(){ btn.classList.remove("charging"); }, 600);
