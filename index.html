<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f4f7fb;--card:#fff;--ink:#0b2447;--muted:#5b6b82;--line:#e3e9f2;--brand:#0e6bd8;--brand2:#0a3d7e;--ok:#16a34a;--err:#dc2626}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh}
  .shell{max-width:560px;margin:0 auto;padding:40px 20px}
  .brand{text-align:center;margin-bottom:26px}
  .mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 10px 24px rgba(11,36,71,.2);margin-bottom:10px}
  h1{font-size:23px;font-weight:800;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
  .form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 16px 40px rgba(11,36,71,.06)}
  .form label{display:block;font-size:13.5px;font-weight:700;margin:0 0 6px;color:#33445c}
  .form label .req{color:var(--err)}
  .form .inp{margin-bottom:16px}
  input,textarea{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);font:inherit;font-size:14.5px;background:#fbfcfe;outline:none;color:var(--ink)}
  input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,107,216,.12)}
  textarea{min-height:120px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border:none;padding:13px 22px;border-radius:12px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:.2s;width:100%;margin-top:4px}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6;cursor:default}
  .note{display:none;text-align:center;font-weight:700;margin-top:14px;font-size:14px}
  .note.ok{color:var(--ok)}
  .note.err{color:var(--err)}
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="mark">⛵</div>
    <h1>تواصل معنا</h1>
    <div class="sub">أرسل رسالتك وسنرد عليك بأقرب وقت</div>
  </div>

  <div class="form">
    <div class="inp"><label for="name">الاسم</label><input id="name" placeholder="اسمك" maxlength="80"></div>
    <div class="inp"><label for="phone">رقم الجوال</label><input id="phone" type="tel" placeholder="05xxxxxxxx" maxlength="20" inputmode="tel"></div>
    <div class="inp"><label for="email">الإيميل</label><input id="email" type="email" placeholder="example@email.com" maxlength="120" inputmode="email"></div>
    <div class="inp"><label for="message">رسالتك <span class="req">*</span></label><textarea id="message" placeholder="اشرح لنا مشكلتك أو استفسارك..." maxlength="2000"></textarea></div>
    <button class="btn" id="send">إرسال الرسالة</button>
    <div class="note ok" id="okMsg">✓ تم استلام رسالتك بنجاح. سنرد عليك بأقرب وقت.</div>
    <div class="note err" id="errMsg"></div>
  </div>

  <footer>جميع الحقوق محفوظة © 2026</footer>
</div>

<script>
function show(el, txt){ el.style.display = "block"; el.textContent = txt || ""; }
function hide(el){ el.style.display = "none"; }
document.getElementById("send").onclick = async function(){
  var btn = this, ok = document.getElementById("okMsg"), err = document.getElementById("errMsg");
  var name = document.getElementById("name").value.trim();
  var phone = document.getElementById("phone").value.trim();
  var email = document.getElementById("email").value.trim();
  var message = document.getElementById("message").value.trim();
  hide(ok); hide(err);
  if (message.length < 3){ show(err, "اكتب رسالتك أولًا."); return; }
  btn.disabled = true;
  try {
    var r = await fetch("https://charming-inspiration-production-fe70.up.railway.app/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, phone: phone, email: email, message: message })
    });
    if (r.ok){ hide(err); show(ok); document.getElementById("message").value = ""; document.getElementById("name").value = ""; document.getElementById("phone").value = ""; document.getElementById("email").value = ""; }
    else { var j = await r.json().catch(() => ({})); show(err, j.error || "تعذر الإرسال. حاول مرة أخرى لاحقًا."); }
  } catch(e){ show(err, "تعذر الإرسال. حاول مرة أخرى لاحقًا."); }
  btn.disabled = false;
};
</script>
</body>
</html>
