<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0b2447;--muted:#5b6b82;--line:#e3e9f2;--brand:#0e6bd8;--brand2:#0a3d7e;--ok:#16a34a;--err:#dc2626}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;color:var(--ink);line-height:1.7;overflow-x:hidden;
    background:linear-gradient(160deg,#0a3d7e 0%,#0e6bd8 45%,#22a7e9 100%)}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:drift 18s ease-in-out infinite}
  .g1{width:420px;height:420px;background:#f472b6;top:-120px;right:-120px}
  .g2{width:380px;height:380px;background:#22d3ee;bottom:-140px;left:-120px;animation-delay:-6s}
  .g3{width:300px;height:300px;background:#a78bfa;top:45%;left:28%;animation-delay:-12s}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.15)}}
  .wave{position:absolute;bottom:0;left:0;width:200%;height:140px}
  .wave svg{width:100%;height:100%;display:block}
  .w1{animation:waveMove 14s linear infinite}
  .w2{animation:waveMove 20s linear infinite reverse;opacity:.7}
  @keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .bub{position:absolute;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
  @keyframes rise{from{transform:translateY(0);opacity:.1}to{transform:translateY(-110vh);opacity:0}}
  .shell{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:44px 20px}
  .brand{text-align:center;margin-bottom:26px;animation:pop .8s cubic-bezier(.2,.9,.3,1.4) both}
  .mark{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:12px;
    box-shadow:0 14px 34px rgba(2,20,60,.35),inset 0 1px 0 rgba(255,255,255,.35);animation:floaty 4s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{font-size:26px;font-weight:800;color:#fff;text-shadow:0 3px 14px rgba(2,20,60,.35)}
  .sub{color:#dbe7fb;font-size:14px;margin-top:6px}
  @keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
  .form{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:28px;
    box-shadow:0 30px 70px -20px rgba(2,20,60,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    backdrop-filter:blur(14px);animation:slideUp .7s cubic-bezier(.2,.8,.2,1) .15s both}
  @keyframes slideUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  .inp{position:relative;margin-bottom:18px;animation:slideUp .7s cubic-bezier(.2,.8,.2,1) both}
  .inp:nth-of-type(1){animation-delay:.22s}.inp:nth-of-type(2){animation-delay:.3s}.inp:nth-of-type(3){animation-delay:.38s}.inp:nth-of-type(4){animation-delay:.46s}
  .inp input,.inp textarea{width:100%;padding:16px 16px 6px;border-radius:13px;border:1.5px solid var(--line);font:inherit;font-size:15px;background:#fbfcfe;outline:none;color:var(--ink);transition:.25s}
  .inp textarea{min-height:120px;resize:vertical;padding-top:22px}
  .inp label{position:absolute;top:13px;right:15px;font-size:14px;color:var(--muted);pointer-events:none;transition:.2s;font-weight:600}
  .inp input:focus,.inp textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(14,107,216,.12)}
  .inp input.filled~label,.inp input:focus~label,.inp textarea.filled~label,.inp textarea:focus~label{top:4px;font-size:11px;color:var(--brand);font-weight:800}
  .counter{text-align:left;font-size:11.5px;color:var(--muted);margin-top:4px;direction:ltr}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);background-size:180% 180%;box-shadow:0 14px 30px -8px rgba(14,107,216,.55);overflow:hidden;transition:.25s;animation:slideUp .7s .55s both}
  .btn:hover{transform:translateY(-2px);box-shadow:0 18px 38px -8px rgba(14,107,216,.65);background-position:100% 50%}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.65;cursor:default}
  .btn .spin{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
  .btn.loading .spin{display:inline-block}
  .btn.loading .lbl{opacity:.85}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note{display:none;text-align:center;font-weight:700;margin-top:14px;font-size:14px;padding:11px;border-radius:11px}
  .note.ok{color:var(--ok);background:#f0fdf4;animation:pop .4s both}
  .note.err{color:var(--err);background:#fef2f2}
  footer{position:relative;z-index:1;text-align:center;color:#cfe0f7;font-size:12.5px;margin:24px 0 10px}
  @media(max-width:520px){.form{padding:22px 18px}.shell{padding-top:28px}}
</style>
</head>
<body>
<div class="bg">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="wave w1"><svg viewBox="0 0 1440 140" preserveAspectRatio="none"><path fill="rgba(255,255,255,.10)" d="M0,70 C240,10 480,130 720,70 C960,10 1200,130 1440,70 L1440,140 L0,140 Z"/></svg></div>
  <div class="wave w2"><svg viewBox="0 0 1440 140" preserveAspectRatio="none"><path fill="rgba(255,255,255,.16)" d="M0,90 C240,30 480,150 720,90 C960,30 1200,150 1440,90 L1440,140 L0,140 Z"/></svg></div>
</div>

<div class="shell">
  <div class="brand">
    <div class="mark">⛵</div>
    <h1>تواصل معنا</h1>
    <div class="sub">أرسل رسالتك وسنرد عليك بأقرب وقت</div>
  </div>

  <div class="form">
    <div class="inp"><input id="name" maxlength="80" autocomplete="name"><label>الاسم</label></div>
    <div class="inp"><input id="phone" type="tel" maxlength="20" inputmode="tel" autocomplete="tel"><label>رقم الجوال</label></div>
    <div class="inp"><input id="email" type="email" maxlength="120" inputmode="email" autocomplete="email"><label>الإيميل</label></div>
    <div class="inp"><textarea id="message" maxlength="2000"></textarea><label>رسالتك *</label>
      <div class="counter" id="cnt">0 / 2000</div>
    </div>
    <button class="btn" id="send"><span class="lbl">إرسال الرسالة</span><span class="spin"></span></button>
    <div class="note ok" id="okMsg">✓ تم استلام رسالتك بنجاح. سنرد عليك بأقرب وقت.</div>
    <div class="note err" id="errMsg"></div>
  </div>

  <footer>جميع الحقوق محفوظة © 2026</footer>
</div>

<script>
(function(){
  for (var i = 0; i < 14; i++){
    (function(){
      var b = document.createElement("div");
      b.className = "bub";
      var s = Math.random() * 16 + 6;
      b.style.width = b.style.height = s + "px";
      b.style.left = Math.random() * 100 + "%";
      b.style.animationDuration = (Math.random() * 14 + 10) + "s";
      b.style.animationDelay = (Math.random() * 12) + "s";
      document.querySelector(".bg").appendChild(b);
    })();
  }
  function sync(el){
    el.classList.toggle("filled", el.value.trim().length > 0);
  }
  ["name","phone","email","message"].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener("input", function(){ sync(el); });
    sync(el);
  });
  var msg = document.getElementById("message");
  msg.addEventListener("input", function(){ document.getElementById("cnt").textContent = msg.value.length + " / 2000"; });

  var send = document.getElementById("send");
  send.onclick = async function(){
    var ok = document.getElementById("okMsg"), err = document.getElementById("errMsg");
    var body = {
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      email: document.getElementById("email").value.trim(),
      message: msg.value.trim()
    };
    ok.style.display = "none"; err.style.display = "none";
    if (body.message.length < 3){ err.textContent = "اكتب رسالتك أولًا."; err.style.display = "block"; return; }
    send.classList.add("loading"); send.disabled = true;
    try {
      var r = await fetch("https://charming-inspiration-production-fe70.up.railway.app/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (r.ok){
        ["name","phone","email","message"].forEach(function(id){
          var el = document.getElementById(id); el.value = ""; sync(el);
        });
        document.getElementById("cnt").textContent = "0 / 2000";
        ok.style.display = "block";
      } else {
        var j = await r.json().catch(function(){ return {}; });
        err.textContent = j.error || "تعذر الإرسال. حاول مرة أخرى لاحقًا.";
        err.style.display = "block";
      }
    } catch(e){ err.textContent = "تعذر الإرسال. حاول مرة أخرى لاحقًا."; err.style.display = "block"; }
    send.classList.remove("loading"); send.disabled = false;
  };
})();
</script>
</body>
</html>
