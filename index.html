<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.Z Crew — الدعم الفني</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Kufi Arabic", Arial, sans-serif;
      background: linear-gradient(160deg, #102B3A 0%, #0D2230 100%);
      color: #E8F4F8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1A5961, #0E3A45);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800;
      color: #D7F8F2;
      margin: 0 auto 20px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #FFFFFF; }
    p.sub { color: #9FB8C0; font-size: 15px; line-height: 1.8; margin-bottom: 28px; }
    a.mail {
      display: inline-block;
      background: linear-gradient(135deg, #14B8A6, #0D9488);
      color: #fff; text-decoration: none;
      font-weight: 700; font-size: 16px;
      padding: 14px 28px; border-radius: 14px;
      margin-bottom: 24px;
      transition: opacity 0.2s;
    }
    a.mail:hover { opacity: 0.9; }
    .alt { font-size: 13px; color: #9FB8C0; }
    .alt span { color: #D7F8F2; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A.Z</div>
    <h1>تطبيق A.Z Crew</h1>
    <p class="sub">منظومة إدارة طاقم الزوارق. نحن هنا لمساعدتك — راسلنا عبر البريد الإلكتروني وسنرد عليك بأقرب وقت.</p>
    <a class="mail" href="mailto:zez.008a@icloud.com">تواصل عبر البريد الإلكتروني</a>
    <p class="alt">أو راسلنا على: <span>zez.008a@icloud.com</span></p>
  </div>
</body>
</html>
