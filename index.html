<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--a:#8b5cf6;--b:#22d3ee;--c:#f472b6;--d:#eab308}
  html,body{min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef0fb;line-height:1.7;overflow-x:hidden;background:#05060d}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .aurora{position:fixed;inset:-30%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
  .aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:blob 18s ease-in-out infinite alternate}
  .aurora i:nth-child(1){width:55vmax;height:55vmax;background:radial-gradient(circle,#8b5cf6,transparent 65%);top:-8%;right:-8%;animation-duration:21s}
  .aurora i:nth-child(2){width:48vmax;height:48vmax;background:radial-gradient(circle,#22d3ee,transparent 65%);bottom:-10%;left:-6%;animation-duration:17s;animation-delay:-6s}
  .aurora i:nth-child(3){width:40vmax;height:40vmax;background:radial-gradient(circle,#f472b6,transparent 65%);top:30%;left:28%;animation-duration:24s;animation-delay:-11s}
  .aurora i:nth-child(4){width:30vmax;height:30vmax;background:radial-gradient(circle,#eab308,transparent 62%);bottom:12%;right:22%;animation-duration:19s;animation-delay:-3s;opacity:.7}
  @keyframes blob{from{transform:translate(0,0) scale(1)}50%{transform:translate(6%,-5%) scale(1.15)}to{transform:translate(-5%,6%) scale(.95)}}
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 10%,transparent 40%,rgba(4,5,12,.75) 100%)}
  .shell{position:relative;z-index:2;max-width:580px;margin:0 auto;padding:44px 20px 30px}
  .brand{text-align:center;margin-bottom:30px}
  .halo{position:relative;width:88px;height:88px;margin:0 auto 20px;perspective:600px;animation:floaty 5s ease-in-out infinite}
  .halo .ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;
    background:conic-gradient(from 0deg,#8b5cf6,#22d3ee,#f472b6,#eab308,#8b5cf6) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 3s linear infinite}
  .halo .orb{position:absolute;inset:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;
    background:radial-gradient(circle at 32% 30%,#2b2f55,#131533);box-shadow:inset 0 0 18px rgba(139,92,246,.45),0 0 34px rgba(139,92,246,.35);animation:orbGlow 3s ease-in-out infinite}
  .halo .ring2{position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(255,255,255,.18);animation:rot 8s linear infinite reverse}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes rot{to{transform:rotate(360deg)}}
  @keyframes orbGlow{0%,100%{box-shadow:inset 0 0 18px rgba(139,92,246,.45),0 0 30px rgba(139,92,246,.3)}50%{box-shadow:inset 0 0 26px rgba(34,211,238,.5),0 0 44px rgba(34,211,238,.4)}}
  .word{display:inline-block;overflow:hidden;vertical-align:bottom}
  .word span{display:inline-block;transform:translateY(110%);animation:lift .7s cubic-bezier(.2,.8,.2,1) forwards}
  .word:nth-child(1) span:nth-child(1){animation-delay:.1s}.word:nth-child(1) span:nth-child(2){animation-delay:.17s}.word:nth-child(1) span:nth-child(3){animation-delay:.24s}.word:nth-child(1) span:nth-child(4){animation-delay:.31s}.word:nth-child(1) span:nth-child(5){animation-delay:.38s}
  .word:nth-child(2) span:nth-child(1){animation-delay:.5s}.word:nth-child(2) span:nth-child(2){animation-delay:.57s}.word:nth-child(2) span:nth-child(3){animation-delay:.64s}.word:nth-child(2) span:nth-child(4){animation-delay:.71s}
  .word:nth-child(3) span:nth-child(1){animation-delay:.9s}.word:nth-child(3) span:nth-child(2){animation-delay:.97s}
  @keyframes lift{to{transform:translateY(0)}}
  h1{font-size:34px;font-weight:900;letter-spacing:-.5px;display:flex;gap:.28em;justify-content:center;direction:rtl;flex-wrap:wrap}
  h1 .word{color:transparent;background:linear-gradient(90deg,#c7d2fe,#a5b4fc,#67e8f9,#a5b4fc);background-size:260% auto;-webkit-background-clip:text;background-clip:text;animation:shiny 5s linear infinite}
  @keyframes shiny{to{background-position:260% center}}
  .sub{color:#8b93ad;font-size:14px;margin-top:10px;animation:fadeUp .9s .8s both;display:flex;align-items:center;justify-content:center;gap:10px}
  .sub::before,.sub::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,#8b93ad);opacity:.5}
  .sub::after{transform:scaleX(-1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card{position:relative;background:rgba(16,18,38,.62);border-radius:26px;padding:32px;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
    border:1px solid rgba(255,255,255,.1);overflow:hidden;animation:fadeUp .9s .5s both}
  .card::before{content:"";position:absolute;inset:-1px;border-radius:26px;padding:1px;background:linear-gradient(135deg,rgba(139,92,246,.7),transparent 40%,transparent 60%,rgba(34,211,238,.7));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .glare{position:absolute;inset:0;border-radius:26px;background:radial-gradient(420px circle at var(--gx) var(--gy),rgba(255,255,255,.14),transparent 46%);opacity:0;transition:opacity .35s;pointer-events:none}
  .card:hover .glare{opacity:1}
  .inp{position:relative;margin-bottom:16px}
  .inp .ic{position:absolute;right:14px;top:16px;font-size:15px;color:#6d7590;transition:.25s;pointer-events:none;font-style:normal}
  .inp input,.inp textarea{width:100%;padding:16px 44px 6px 14px;border-radius:15px;border:1px solid rgba(255,255,255,.11);background:rgba(10,12,26,.6);font:inherit;font-size:15px;color:#eef0fb;outline:none;transition:.28s;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
  .inp textarea{min-height:124px;resize:vertical;padding-top:24px}
  .inp label{position:absolute;top:15px;right:42px;font-size:13.5px;color:#6d7590;pointer-events:none;transition:.22s cubic-bezier(.2,.8,.2,1);font-weight:600;letter-spacing:.2px}
  .inp:focus-within .ic{color:#a78bfa;transform:scale(1.15) translateY(-1px)}
  .inp input:focus,.inp textarea:focus{border-color:#8b5cf6;background:rgba(12,14,32,.85);box-shadow:0 0 0 4px rgba(139,92,246,.16),0 0 26px -6px rgba(139,92,246,.6)}
  .inp.filled label,.inp:focus-within label{top:4px;font-size:10.5px;color:#a78bfa}
  .inp.filled .ic{color:#a78bfa}
  .track{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
  .track i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#8b5cf6,#22d3ee,#f472b6);transition:width .2s;box-shadow:0 0 12px rgba(139,92,246,.7)}
  .counter{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:#6d7590}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:16px;padding:17px;font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer;margin-top:8px;overflow:hidden;
    background:linear-gradient(135deg,#7c3aed,#a855f7 45%,#06b6d4);background-size:220% 220%;transition:transform .2s,box-shadow .3s;box-shadow:0 18px 42px -14px rgba(124,58,237,.7)}
  .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%);transform:translateX(-130%);transition:transform .7s}
  .btn:hover{background-position:100% 50%;box-shadow:0 22px 54px -14px rgba(6,182,212,.75);transform:translateY(-2px)}
  .btn:hover::before{transform:translateX(130%)}
  .btn:active{transform:scale(.97)}
  .btn .spin{display:none;width:19px;height:19px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite}
  .btn.loading .spin{display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .burst{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:fly 1s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--bx),var(--by)) scale(0);opacity:0}}
  .note{display:none;text-align:center;margin-top:16px;font-weight:700;font-size:14px;border-radius:13px;padding:13px}
  .note.ok{color:#4ade80;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25)}
  .note.err{color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25)}
  .check{display:none;margin:8px auto 0;width:52px;height:52px}
  .check circle{stroke:#4ade80;stroke-width:3;fill:none;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .6s ease forwards}
  .check path{stroke:#4ade80;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s ease .55s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .confetti{position:fixed;z-index:5;width:9px;height:14px;top:-20px;pointer-events:none;opacity:.95;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
  .signature{text-align:center;margin-top:30px;position:relative;z-index:2;animation:fadeUp 1s .9s both}
  .signature .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:4px;color:#6d7590;margin-bottom:10px;text-transform:uppercase}
  .abdullah-signature{font-family:'Alex Brush',cursive;font-size:58px;line-height:1.1;display:inline-block;position:relative;
    background:linear-gradient(180deg,#67e8f9 0%,#818cf8 55%,#c084fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(129,140,248,.45));animation:sign 2s cubic-bezier(.2,.8,.2,1) 1.6s both}
  @keyframes sign{from{opacity:0;letter-spacing:14px;filter:blur(10px)}to{opacity:1;letter-spacing:2px;filter:blur(0)}}
  .sig-line{position:relative;width:200px;height:2px;margin:14px auto 0}
  .sig-line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .sig-line path{fill:none;stroke:url(#sigGrad);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:drawS 1.1s ease-out 2.8s forwards}
  .sig-line .dot{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#c084fc;box-shadow:0 0 12px 3px rgba(192,132,252,.8);opacity:0;animation:dotPop .5s ease-out 3.8s forwards}
  .sig-line .dot:first-child{left:0}.sig-line .dot:last-child{right:0}
  @keyframes drawS{to{stroke-dashoffset:0}}
  @keyframes dotPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  .sig-spark i{position:absolute;font-style:normal;font-size:13px;color:#c4b5fd;opacity:0;animation:spark 2.4s ease-in-out infinite}
  .sig-spark i:nth-child(1){left:-34px;top:4px;animation-delay:3s}
  .sig-spark i:nth-child(2){right:-30px;top:-6px;animation-delay:3.6s}
  .sig-spark i:nth-child(3){left:-14px;bottom:-14px;animation-delay:3.2s;font-size:9px}
  .sig-spark i:nth-child(4){right:-8px;bottom:-18px;animation-delay:4s;font-size:9px}
  @keyframes spark{0%,60%,100%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1)}45%{opacity:.9;transform:translateY(-4px) scale(.9)}}
  footer{position:relative;z-index:2;text-align:center;color:#5c6478;font-size:12.5px;margin:26px 0 6px}
  @media(max-width:520px){.card{padding:22px 16px}.shell{padding-top:28px}h1{font-size:27px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="vignette"></div>

<div class="shell">
  <div class="brand">
    <div class="halo"><i class="ring2"></i><i class="ring"></i><div class="orb">✦</div></div>
    <h1>
      <span class="word"><span>ت</span><span>و</span><span>ا</span><span>ص</span><span>ل</span></span>
      <span class="word"><span>م</span><span>ع</span><span>ن</span><span>ا</span></span>
      <span class="word"><span>✦</span><span>✦</span></span>
    </h1>
    <div class="sub">أرسل رسالتك وسنرد عليك بأقرب وقت</div>
  </div>

  <div class="card" id="card">
    <div class="glare" id="glare"></div>
    <div class="inp"><span class="ic">◈</span><input id="name" maxlength="80" autocomplete="name"><label>الاسم</label></div>
    <div class="inp"><span class="ic">◉</span><input id="phone" type="tel" maxlength="20" inputmode="tel" autocomplete="tel"><label>رقم الجوال</label></div>
    <div class="inp"><span class="ic">✉</span><input id="email" type="email" maxlength="120" inputmode="email" autocomplete="email"><label>الإيميل</label></div>
    <div class="inp"><span class="ic">❋</span><textarea id="message" maxlength="2000"></textarea><label>رسالتك *</label>
      <div class="track"><i id="pbar"></i></div>
      <div class="counter"><span id="cnt">0 / 2000</span><span>مطلوب</span></div>
    </div>
    <button class="btn" id="send"><span class="lbl">إرسال الرسالة</span><span class="spin"></span></button>
    <svg class="check" id="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-16"/></svg>
    <div class="note ok" id="okMsg">تم استلام رسالتك بنجاح</div>
    <div class="note err" id="errMsg"></div>
  </div>

  <div class="signature">
    <span class="lbl">Designed with passion</span>
    <span class="abdullah-signature"><span class="sig-spark"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></span>Abdullah</span>
    <div class="sig-line">
      <svg viewBox="0 0 200 10"><defs><linearGradient id="sigGrad" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><path d="M2 6 Q 50 2 100 6 T 198 5"/></svg>
      <i class="dot"></i><i class="dot"></i>
    </div>
  </div>

  <footer>جميع الحقوق محفوظة © 2026</footer>
</div>

<script>
(function(){
  var cv = document.getElementById("stars"), ctx = cv.getContext("2d"), W, H, pts = [], mx = -999, my = -999;
  function rs(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", rs); rs();
  for (var i = 0; i < 90; i++){ pts.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+.4, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35}); }
  addEventListener("mousemove", function(e){ mx = e.clientX; my = e.clientY; });
  addEventListener("mouseleave", function(){ mx = -999; my = -999; });
  (function draw(){
    ctx.clearRect(0,0,W,H);
    for (var i = 0; i < pts.length; i++){
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = "rgba(167,139,250,.75)"; ctx.fill();
      for (var j = i + 1; j < pts.length; j++){
        var q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx*dx + dy*dy;
        if (d2 < 11000){ ctx.strokeStyle = "rgba(139,92,246," + (0.16 * (1 - d2/11000)) + ")"; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
      }
      if (mx > 0){ var dm = (p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my); if (dm < 90000){ ctx.strokeStyle = "rgba(34,211,238," + (0.3*(1-dm/90000)) + ")"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mx,my); ctx.stroke(); } }
    }
    requestAnimationFrame(draw);
  })();

  var card = document.getElementById("card"), glare = document.getElementById("glare");
  card.addEventListener("mousemove", function(e){
    var r = card.getBoundingClientRect();
    glare.style.setProperty("--gx", (e.clientX - r.left) + "px");
    glare.style.setProperty("--gy", (e.clientY - r.top) + "px");
    var dx = ((e.clientX - r.left) / r.width - .5) * 2.4, dy = ((e.clientY - r.top) / r.height - .5) * 2.4;
    card.style.transform = "perspective(900px) rotateY(" + dx + "deg) rotateX(" + (-dy) + "deg)";
  });
  card.addEventListener("mouseleave", function(){ card.style.transform = ""; });

  var btn = document.getElementById("send");
  btn.addEventListener("click", function(e){
    var r = btn.getBoundingClientRect();
    var cols = ["#8b5cf6","#22d3ee","#f472b6","#eab308","#fff"];
    for (var k = 0; k < 14; k++){
      var b = document.createElement("i"); b.className = "burst";
      var a = Math.random() * Math.PI * 2, d = 26 + Math.random() * 70;
      b.style.cssText = "left:" + (e.clientX - r.left) + "px;top:" + (e.clientY - r.top) + "px;background:" + cols[k % cols.length] + ";--bx:" + Math.cos(a) * d + "px;--by:" + Math.sin(a) * d + "px;box-shadow:0 0 10px " + cols[k % cols.length];
      btn.appendChild(b); setTimeout(function(el){ el.remove(); }, 1000, b);
    }
  });

  function confetti(){
    var cols = ["#8b5cf6","#22d3ee","#f472b6","#eab308","#4ade80"];
    for (var k = 0; k < 60; k++){
      var c = document.createElement("i"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = cols[k % cols.length];
      c.style.animationDuration = (2.4 + Math.random() * 2.4) + "s";
      c.style.animationDelay = Math.random() * .8 + "s";
      c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
      document.body.appendChild(c);
      setTimeout(function(el){ el.remove(); }, 6000, c);
    }
  }

  function sync(id){ document.getElementById(id).classList.toggle("filled", document.getElementById(id).value.trim().length > 0); }
  ["name","phone","email"].forEach(function(id){ document.getElementById(id).addEventListener("input", function(){ sync(id); }); });
  var msg = document.getElementById("message");
  msg.addEventListener("input", function(){
    sync("message");
    document.getElementById("cnt").textContent = msg.value.length + " / 2000";
    var pc = Math.min(100, msg.value.length / 2000 * 100);
    document.getElementById("pbar").style.width = pc + "%";
  });

  btn.onclick = function(){
    var ok = document.getElementById("okMsg"), err = document.getElementById("errMsg"), check = document.getElementById("check");
    var body = { name: document.getElementById("name").value.trim(), phone: document.getElementById("phone").value.trim(), email: document.getElementById("email").value.trim(), message: msg.value.trim() };
    ok.style.display = "none"; err.style.display = "none"; check.style.display = "none";
    if (body.message.length < 3){ err.textContent = "اكتب رسالتك أولًا."; err.style.display = "block"; return; }
    btn.classList.add("loading"); btn.disabled = true;
    fetch("https://charming-inspiration-production-fe70.up.railway.app/api/contact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function(r){ if (r.ok) return true; return r.json().then(function(j){ throw new Error(j.error || "تعذر الإرسال"); }); })
      .then(function(){
        ["name","phone","email","message"].forEach(function(id){ var el = document.getElementById(id); el.value = ""; sync(id); });
        document.getElementById("cnt").textContent = "0 / 2000"; document.getElementById("pbar").style.width = "0";
        check.style.display = "block"; check.style.animation = "none"; check.offsetHeight; check.style.animation = "";
        ok.style.display = "block"; confetti();
      })
      .catch(function(e){ err.textContent = e.message || "تعذر الإرسال. حاول مرة أخرى لاحقًا."; err.style.display = "block"; })
      .then(function(){ btn.classList.remove("loading"); btn.disabled = false; });
  };
})();
</script>
</body>
</html>
